<style>

    --accent: #e74c3c;

  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;

  .sidebar { background: var(--card); border-radius: 8px; padding: 16px; height: fit-content;

  .sidebar h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; color: var(--muted);

  .filter-group { margin-bottom: 16px; }
  .filter-item { display: block; padding: 4px 0; font-size: 13px; cursor: pointer; }
  .filter-item input { margin-right: 6px; }
  .filter-item .count { color: var(--muted); font-size: 11px; }
  .price-range { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .price-range input { width: 70px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; }
  .btn-clear { width: 100%; padding: 6px; margin-top: 4px; background: white; border: 1px solid var(--border);

  .btn-clear:hover { background: var(--bg); }
  .main { }
  .toolbar { background: var(--card); padding: 10px 16px; border-radius: 8px; margin-bottom: 12px;

             box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .toolbar .count { font-size: 14px; }

                                     font-size: 13px; }

  .card { background: var(--card); border-radius: 8px; overflow: hidden; cursor: pointer;

  .card-price .was { font-size: 11px; color: var(--muted); text-decoration: line-through; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

Kapacita": "320GB", "Formát": "2,5\"", "Rozhraní": "SATA III", "Stav": "použité, otestované", "Záruka": "24 měsíců"}, "form": "2,5\"", "interface": "SATA III", "capacity": "320GB", "type": "HDD"}];
const FILTERS = { type: new Set(), brand: new Set(), capacity: new Set(), form: new Set(), interface: new Set() };
let priceMin = null, priceMax = null;

function uniq(key) {
  const m = new Map();
  DATA.forEach(d => {
    const v = d[key] || '?';
    m.set(v, (m.get(v) || 0) + 1);
  });
  return Array.from(m.entries()).sort((a,b) => b[1] - a[1]);
}

// Filter values stored as index-based (avoid HTML attribute escape issues with uvozovky v "3,5"")
const FILTER_OPTIONS = {};  // field -> [val1, val2, ...]
function buildFilters() {
  const fields = ['type', 'brand', 'capacity', 'form', 'interface'];
  fields.forEach(f => {
    const cont = document.getElementById('f-' + f);
    const vals = uniq(f);
    FILTER_OPTIONS[f] = vals.map(([v, c]) => v);
    cont.innerHTML = vals.map(([v, c], i) =>
      `<label class="filter-item"><input type="checkbox" data-field="${f}" data-idx="${i}" onchange="onFilterChange(this)">${escapeHtml(v)} <span class="count">(${c})</span></label>`
    ).join('');
  });
}

function onFilterChange(el) {
  const f = el.dataset.field, idx = parseInt(el.dataset.idx);
  const v = FILTER_OPTIONS[f][idx];
  if (el.checked) FILTERS[f].add(v); else FILTERS[f].delete(v);
  renderGrid();
}

document.getElementById('price-min').addEventListener('input', e => {
  priceMin = e.target.value ? parseInt(e.target.value) : null; renderGrid();
});
document.getElementById('price-max').addEventListener('input', e => {
  priceMax = e.target.value ? parseInt(e.target.value) : null; renderGrid();
});
document.getElementById('search').addEventListener('input', renderGrid);
document.getElementById('sort').addEventListener('change', renderGrid);

function clearFilters() {
  Object.values(FILTERS).forEach(s => s.clear());
  priceMin = priceMax = null;
  document.querySelectorAll('.sidebar input').forEach(i => { i.checked = false; i.value = ''; });
  document.getElementById('search').value = '';
  renderGrid();
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  return DATA.filter(d => {
    for (const f of ['type','brand','capacity','form','interface']) {
      if (FILTERS[f].size > 0 && !FILTERS[f].has(d[f] || '?')) return false;
    }
    if (priceMin !== null && d.price < priceMin) return false;
    if (priceMax !== null && d.price > priceMax) return false;
    if (q) {
      const txt = (d.name + ' ' + d.brand + ' ' + (d.params['HDD - Série']||'') + ' ' + d.code).toLowerCase();
      if (!txt.includes(q)) return false;
    }
    return true;
  });
}

function sorted(list) {
  const s = document.getElementById('sort').value;
  return list.slice().sort((a,b) => {
    if (s === 'price-asc') return a.price - b.price;
    if (s === 'price-desc') return b.price - a.price;
    if (s === 'qty-desc') return b.qty - a.qty;
    if (s === 'brand') return (a.brand||'').localeCompare(b.brand||'');
    if (s === 'name') return a.name.localeCompare(b.name);
    return 0;
  });
}

function renderGrid() {
  const list = sorted(filtered());
  document.getElementById('result-count').textContent = list.length + ' z ' + DATA.length + ' produktů';
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (!list.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = list.map((d, idx) => `
    <div class="card" onclick="openModal('${d.code}')">
      <div class="card-img">
        <span class="badge ${d.type}">${d.type}</span>
        <span class="stock-badge">${d.qty} ks</span>
        ${d.img ? `<img src="${d.img}" loading="lazy" alt="${escapeAttr(d.name)}">` : '<span style="color:#ccc">no img</span>'}
      </div>
      <div class="card-body">
        <div class="card-brand">${d.brand}</div>
        <div class="card-name">${escapeHtml(d.name)}</div>
        <div class="card-params">
          <span>${d.capacity}</span>
          <span>${d.form}</span>
          <span>${d.interface}</span>
        </div>
        <div class="card-price">
          <span class="now">${d.price} Kč</span>
          ${d.std_price > d.price ? `<span class="was">${d.std_price} Kč</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }

function openModal(code) {
  const d = DATA.find(x => x.code === code);
  if (!d) return;
  const params = Object.entries(d.params).map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join('');
  const props = Object.entries(d.props).map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(v)}</td></tr>`).join('');
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-grid">
      <div class="modal-img">${d.img ? `<img src="${d.img}">` : 'no image'}</div>
      <div class="modal-info">
        <div style="font-size:11px;color:#7a8a9a;text-transform:uppercase">${d.brand}</div>
        <h2>${escapeHtml(d.name)}</h2>
        <div class="meta">CODE: <code>${d.code}</code> • záruka ${d.warranty}</div>
        <span class="stock">✓ Skladem ${d.qty} ks</span>
        <div class="price-row">
          <span class="price-now">${d.price} Kč</span>
          ${d.std_price > d.price ? `<span class="price-was">${d.std_price} Kč</span>` : ''}
        </div>
      </div>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" onclick="showTab(event, 'pane-desc')">Popis</button>
      <button class="modal-tab" onclick="showTab(event, 'pane-params')">Parametry (${Object.keys(d.params).length})</button>
      <button class="modal-tab" onclick="showTab(event, 'pane-props')">Vlastnosti (${Object.keys(d.props).length})</button>
    </div>
    <div class="modal-pane active" id="pane-desc"><div class="modal-desc">${d.desc}</div></div>
    <div class="modal-pane" id="pane-params">
      <table>${params || '<tr><td colspan="2" style="color:#999">Žádné filter parametry</td></tr>'}</table>
    </div>
    <div class="modal-pane" id="pane-props">
      <table>${props || '<tr><td colspan="2" style="color:#999">Žádné text vlastnosti</td></tr>'}</table>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
  document.body.style.overflow = '';
}
function showTab(e, paneId) {
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.modal-pane').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(paneId).classList.add('active');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

buildFilters();
renderGrid();
</script>
